apiVersion: batch/v1
kind: Job
metadata:
  name: kai-lab
  labels:
    app: kai-lab
spec:
  # An interactive session is not an experiment: if it dies, nothing of scientific
  # value is lost (the venv, the notebooks and the outputs all live on kai-data).
  backoffLimit: 0
  # 6 h hard stop. Nautilus reaps idle GPU pods anyway; making the deadline explicit
  # means the GPU comes back to the pool on its own after a forgotten session.
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels:
        app: kai-lab
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values: [k8s-chase-ci-07.calit2.optiputer.net, k8s-chase-ci-10.calit2.optiputer.net, k8s-haosu-22.sdsc.optiputer.net, ry-gpu-08.sdsc.optiputer.net, suncave-1, suncave-2, suncave-3, suncave-4, suncave-5, suncave-6, suncave-7, suncave-8, suncave-9, suncave-10, suncave-11, suncave-12, suncave-13, suncave-14, suncave-15, suncave-16, suncave-17, suncave-18, suncave-19, suncave-20]
              - key: kubernetes.io/arch
                operator: In
                values: [amd64]
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A10
                - NVIDIA-L4
                - NVIDIA-GeForce-RTX-2080-Ti
                - NVIDIA-A40
                - NVIDIA-RTX-A5000
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-GeForce-RTX-4090
                - NVIDIA-L40S
                - NVIDIA-L40
                - NVIDIA-RTX-A6000
                - Tesla-V100-SXM2-32GB
                - Tesla-V100-PCIE-32GB
          preferredDuringSchedulingIgnoredDuringExecution:
          # Cheap tier only. A notebook must never sit on a flagship - the model is
          # d_model=32 and the point of this pod is latency-to-first-cell, not FLOPs.
          - weight: 100
            preference:
              matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-A10, NVIDIA-L4, NVIDIA-GeForce-RTX-2080-Ti, NVIDIA-A40, NVIDIA-RTX-A5000, NVIDIA-GeForce-RTX-3090, Tesla-V100-SXM2-32GB, Tesla-V100-PCIE-32GB]
      containers:
      - name: lab
        image: python:3.12
        command: ["bash", "-c"]
        args:
        - |
          set -eo pipefail
          LAB=/data/lab
          VENV=$LAB/venv
          mkdir -p "$LAB"/{notebooks,outputs,store,repo,pipcache,wandb}

          # ---- venv lives on the PVC, so this is a one-time 41 min cost and every
          # later `lab.sh up` starts in seconds. Pins mirror the r14 training pods
          # exactly (manual-round-runbook.md Phase 0) - do not drift them. ----
          if [ ! -x "$VENV/bin/python" ]; then
            echo "[venv] $(date) creating $VENV (cold build measured at 41 min on 2026-09-08)"
            python -m venv "$VENV"
            "$VENV/bin/pip" install -q --upgrade pip
            "$VENV/bin/pip" install --cache-dir "$LAB/pipcache" \
              "tensorflow[and-cuda]==2.21.0" "keras==3.15.0" "hgq2==0.1.9" \
              "quantizers==1.2.2" "scikit-learn==1.9.0" "h5py==3.14.0" \
              "wandb==0.28.0" "hls4ml==1.3.0" "numpy==2.5.0" \
              jupyterlab ipywidgets matplotlib
            echo "[venv] $(date) done"
          else
            echo "[venv] reusing existing $VENV"
          fi
          # NB: the pip distribution is `hgq2`, the import name is `hgq`.
          "$VENV/bin/python" -c "import tensorflow, keras, hgq, hls4ml; print('[venv] tf', tensorflow.__version__, '| keras', keras.__version__, '| hgq', hgq.__version__, '| hls4ml', hls4ml.__version__)"

          # TF 2.21's pip wheel cannot find the nvidia-*-cu12 wheel libs by RPATH
          # (verified 2026-07-07); point LD_LIBRARY_PATH at them explicitly.
          NVLIBS=$("$VENV/bin/python" -c "import glob; print(':'.join(sorted(glob.glob('$VENV/lib/python*/site-packages/nvidia/*/lib'))))")
          export LD_LIBRARY_PATH="$NVLIBS${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          echo "[gpu] $(date)"
          nvidia-smi --query-gpu=name,memory.total --format=csv,noheader || { echo "[fatal] no GPU"; exit 1; }
          KERAS_BACKEND=tensorflow "$VENV/bin/python" -c "import tensorflow as tf; g=tf.config.list_physical_devices('GPU'); assert g,'NO GPU visible to TensorFlow'; print('[gpu] TF sees', g)"

          echo "[data] $(ls /data/hls4ml_lhc_jet/train/train/*.h5 2>/dev/null | wc -l) train .h5 files on kai-data"

          # ---- kernel environment. Every notebook inherits these. ----
          export KERAS_BACKEND=tensorflow MPLBACKEND=Agg TF_FORCE_GPU_ALLOW_GROWTH=true
          export BNHGQ2_TRAIN_DATA=/data/hls4ml_lhc_jet/train/train
          export BNHGQ2_OUT_ROOT=$LAB/outputs
          export BNHGQ2_STORE=$LAB/store
          export PYTHONPATH=$LAB/repo/bnjettag/code/hgq2
          # No WANDB_API_KEY is mounted on purpose: wandb_util.wandb_enabled() then
          # returns False and scratch runs cannot land next to the r14 record.
          export WANDB_MODE=offline WANDB_DIR=$LAB/wandb

          echo "[jupyter] $(date) starting on :8888 (reach it with lab.sh forward)"
          exec "$VENV/bin/jupyter" lab \
            --ip=0.0.0.0 --port=8888 --no-browser --allow-root \
            --ServerApp.root_dir="$LAB"
        resources:
          limits:
            nvidia.com/gpu: "1"
            cpu: "4"
            memory: 16Gi
            ephemeral-storage: 10Gi
          requests:
            nvidia.com/gpu: "1"
            cpu: "4"
            memory: 16Gi
            ephemeral-storage: 10Gi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kai-data
