apiVersion: batch/v1
kind: Job
metadata:
  name: kai-ebops-n8-preflight-8ceec939
  namespace: cms-ml
  labels:
    app: kai-ebops-n8-preflight
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: kai-ebops-n8-preflight
    spec:
      restartPolicy: Never
      containers:
      - name: preflight
        image: python:3.12
        command:
        - bash
        - -c
        args:
        - 'set -euo pipefail

          export KERAS_BACKEND=tensorflow CUDA_VISIBLE_DEVICES=-1 WANDB_MODE=disabled

          export BNF_CODE=/work/code BNF_CONFIG_GLOB=''ebops-n8-*.json'' BNF_SKIP_INSTALL=1

          mkdir -p "$BNF_CODE"

          echo ''8ceec939f79440626417381a76c8c438f06152d691395f1a6cbf536a31872a17  /cmcode/hgq2.tar.gz''
          | sha256sum -c -

          tar -xzf /cmcode/hgq2.tar.gz -C "$BNF_CODE" --strip-components=1

          export PYTHONPATH="$BNF_CODE"

          pip install -q --no-cache-dir tensorflow==2.21.0 keras==3.15.0 hgq2==0.1.9
          quantizers==1.2.2 scikit-learn==1.9.0 h5py==3.14.0 wandb==0.28.0 hls4ml==1.3.0
          numpy==2.5.0

          bash "$BNF_CODE/preflight_final.sh"

          python -u "$BNF_CODE/check_ebops_target.py" --integration

          python -u "$BNF_CODE/check_ebops_costfirst.py" --integration

          python -u "$BNF_CODE/check_ebops_long.py"

          '
        resources:
          requests:
            cpu: '2'
            memory: 4Gi
            ephemeral-storage: 8Gi
          limits:
            cpu: '2'
            memory: 4Gi
            ephemeral-storage: 8Gi
        volumeMounts:
        - name: cmcode
          mountPath: /cmcode
        - name: work
          mountPath: /work
      volumes:
      - name: cmcode
        configMap:
          name: kai-ebops-n8-code-8ceec939f7
      - name: work
        emptyDir:
          sizeLimit: 16Gi
      nodeSelector:
        kubernetes.io/arch: amd64
