apiVersion: batch/v1
kind: Job
metadata:
  name: kai-accuracy-selection-smoke-0917
  namespace: cms-ml
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: kai-accuracy-selection-smoke-0917
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: smoke
          image: python:3.12
          command: [bash, -c]
          args:
            - |
              set -euo pipefail
              export KERAS_BACKEND=tensorflow WANDB_MODE=disabled CUDA_VISIBLE_DEVICES=-1
              export TF_CPP_MIN_LOG_LEVEL=2 OMP_NUM_THREADS=2 TF_NUM_INTRAOP_THREADS=2 TF_NUM_INTEROP_THREADS=1 OPENBLAS_NUM_THREADS=1
              mkdir -p /work/code
              echo '64d7fd909bd71c731f882bc3344e69c055d7abed10087a460c767787882e063c  /cmcode/hgq2.tar.gz' | sha256sum -c -
              tar -xzf /cmcode/hgq2.tar.gz -C /work/code --strip-components=1
              cp /eval/ablation.py /work/code/bnhgq2/ablation.py
              export PYTHONPATH=/work/code
              pip install -q --no-cache-dir tensorflow==2.21.0 keras==3.15.0 hgq2==0.1.9 quantizers==1.2.2 h5py==3.14.0 hls4ml==1.3.0 numpy==2.5.0 scikit-learn==1.9.0
              python -u /eval/integration_smoke.py
          resources:
            requests: {cpu: '2', memory: 8Gi, ephemeral-storage: 8Gi}
            limits: {cpu: '2', memory: 8Gi, ephemeral-storage: 8Gi}
          volumeMounts:
            - {name: training-code, mountPath: /cmcode, readOnly: true}
            - {name: smoke-code, mountPath: /eval, readOnly: true}
            - {name: work, mountPath: /work}
      volumes:
        - name: training-code
          configMap: {name: kai-ebops-abl-code-64d7fd909b}
        - name: smoke-code
          configMap: {name: kai-accuracy-selection-smoke-code-0917}
        - name: work
          emptyDir: {sizeLimit: 8Gi}
